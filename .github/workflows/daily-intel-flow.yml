name: Daily Intel Flow

on:
  schedule:
    # 00:00 UTC = 08:00 Asia/Shanghai
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  daily:
    runs-on: ubuntu-latest

    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
      OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
      WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
      WEBHOOK_TYPE: ${{ secrets.WEBHOOK_TYPE }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TELEGRAM_API_BASE: ${{ secrets.TELEGRAM_API_BASE }}
      ENABLE_AI_SUMMARY: ${{ secrets.ENABLE_AI_SUMMARY }}
      MAX_ITEMS_PER_SOURCE: ${{ secrets.MAX_ITEMS_PER_SOURCE }}
      REPORT_TIMEZONE: ${{ secrets.REPORT_TIMEZONE }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate daily report
        run: npm run once

      - name: Copy report to root for GitHub Pages
        run: cp public/index.html index.html

      - name: Commit and push updated report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull origin main --rebase --strategy-option=theirs || true
          git add public/index.html index.html
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore(report): daily intel update [skip ci]"
            git push
          fi
