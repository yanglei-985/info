name: Daily Intel Flow

on:
  schedule:
    # 21:00 UTC = 05:00 Asia/Shanghai (next day)
    - cron: "0 21 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  daily:
    runs-on: ubuntu-latest

    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
      OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
      WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
      WEBHOOK_TYPE: ${{ secrets.WEBHOOK_TYPE }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TELEGRAM_API_BASE: ${{ secrets.TELEGRAM_API_BASE }}
      ENABLE_AI_SUMMARY: ${{ secrets.ENABLE_AI_SUMMARY }}
      MAX_ITEMS_PER_SOURCE: ${{ secrets.MAX_ITEMS_PER_SOURCE }}
      REPORT_TIMEZONE: ${{ secrets.REPORT_TIMEZONE }}

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate daily report
        run: npm run once

      - name: Copy report to docs/ for GitHub Pages
        run: |
          mkdir -p docs
          cp public/index.html docs/index.html

      - name: Commit and push with retry
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Save our generated files in case rebase overwrites them
          cp public/index.html /tmp/public-index.html
          cp docs/index.html /tmp/docs-index.html

          git add public/index.html docs/index.html
          if git diff --staged --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "chore(report): daily intel update [skip ci]"

          # Retry up to 5 times. On push rejection: reset to origin/main,
          # restore our generated files, re-commit, then push.
          for i in 1 2 3 4 5; do
            if git push origin main; then
              echo "Push successful on attempt $i."
              exit 0
            fi
            echo "Push rejected on attempt $i/5. Resetting to remote and re-applying our report..."

            git rebase --abort 2>/dev/null || true
            git fetch origin main
            git reset --hard origin/main

            mkdir -p docs
            cp /tmp/public-index.html public/index.html
            cp /tmp/docs-index.html docs/index.html

            git add public/index.html docs/index.html
            if git diff --staged --quiet; then
              echo "Report already up-to-date on remote. Exiting cleanly."
              exit 0
            fi
            git commit -m "chore(report): daily intel update [skip ci]"

            sleep 2
          done

          echo "Failed to push after 5 attempts."
          exit 1
